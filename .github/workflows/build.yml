name: Build BaojunBLEHUD Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -skL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          mv /tmp/sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/ 2>/dev/null || \
          mv /tmp/sdks-master/iPhoneOS*.sdk $HOME/theos/sdks/ 2>/dev/null || \
          cp -r /tmp/sdks-master/* $HOME/theos/sdks/
          ls $HOME/theos/sdks/

      - name: Build RootHide package
        run: |
          set -o pipefail
          make clean package THEOS_PACKAGE_SCHEME=rootless messages=yes 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baojun-ble-hud-deb
          path: packages/*.deb
